name: CI and CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: weblytics-studio
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: weblytics-studio/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check backend JavaScript syntax
        run: find server -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Build frontend
        run: npm run build

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: weblytics-client-dist
          path: weblytics-studio/client/dist
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy production services
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Trigger frontend deployment
        env:
          DEPLOY_HOOK_URL: ${{ secrets.FRONTEND_DEPLOY_HOOK_URL }}
        run: |
          if [[ -z "$DEPLOY_HOOK_URL" ]]; then
            echo "::notice title=Frontend deploy skipped::Set FRONTEND_DEPLOY_HOOK_URL to enable frontend deployments."
            exit 0
          fi
          curl --fail --silent --show-error --request POST "$DEPLOY_HOOK_URL"

      - name: Trigger backend deployment
        env:
          DEPLOY_HOOK_URL: ${{ secrets.BACKEND_DEPLOY_HOOK_URL }}
        run: |
          if [[ -z "$DEPLOY_HOOK_URL" ]]; then
            echo "::notice title=Backend deploy skipped::Set BACKEND_DEPLOY_HOOK_URL to enable backend deployments."
            exit 0
          fi
          curl --fail --silent --show-error --request POST "$DEPLOY_HOOK_URL"